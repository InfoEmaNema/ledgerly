<script>
/* JavaScript — state, persistence, rendering, interactions, and custom charts */
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s)), KEY='familyFinance.v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10), iso=d=>{const x=new Date(d);return isNaN(x)?'':new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}, today=()=>iso(new Date());
const seed=()=>{const cats=[['Salary','income','#00ff88'],['Groceries','expense','#a2e86f'],['Housing','expense','#6bd3ff'],['Transport','expense','#ffb45c'],['Dining','expense','#ff7b91'],['Entertainment','expense','#b998ff'],['Health','expense','#58d6bd'],['Utilities','expense','#f1d56b']].map(([name,type,color])=>({id:uid(),name,type,color}));const a=[{id:uid(),name:'Main Account',type:'Checking',initialBalance:2450},{id:uid(),name:'Credit Card',type:'Credit Card',initialBalance:320}];const members=['Alex','Jordan'];const tx=[];const add=(ago,amount,type,cat,account,member,note)=>{let d=new Date();d.setDate(d.getDate()-ago);tx.push({id:uid(),date:iso(d),amount,type,categoryId:cats.find(c=>c.name===cat).id,accountId:a[account].id,member,note})};[[1,82.46,'expense','Groceries',0,'Alex','Weekly groceries'],[2,42,'expense','Transport',1,'Jordan','Metro pass'],[4,68.2,'expense','Dining',1,'Alex','Dinner out'],[6,95,'expense','Utilities',0,'Jordan','Electric bill'],[9,54.8,'expense','Health',0,'Alex','Pharmacy'],[12,126,'expense','Entertainment',1,'Jordan','Concert tickets'],[15,74.63,'expense','Groceries',0,'Jordan','Market'],[18,3200,'income','Salary',0,'Alex','Monthly salary'],[20,700,'expense','Housing',0,'Jordan','Rent'],[22,36.5,'expense','Dining',1,'Jordan','Lunch'],[28,91,'expense','Groceries',0,'Alex','Groceries'],[33,48,'expense','Transport',1,'Alex','Fuel'],[38,125,'expense','Utilities',0,'Jordan','Internet and utilities'],[43,3200,'income','Salary',0,'Jordan','Monthly salary'],[47,700,'expense','Housing',0,'Alex','Rent'],[52,110,'expense','Entertainment',1,'Alex','Family movie night'],[61,69.1,'expense','Groceries',0,'Jordan','Groceries'],[69,240,'expense','Health',0,'Alex','Dental visit'],[75,3200,'income','Salary',0,'Alex','Monthly salary'],[81,700,'expense','Housing',0,'Jordan','Rent']].forEach(x=>add(...x));return{version:1,accounts:a,categories:cats,transactions:tx,budgets:[['Groceries',450],['Housing',700],['Dining',180]].map(([n,monthlyLimit])=>({categoryId:cats.find(c=>c.name===n).id,monthlyLimit})),members,settings:{currency:'USD',locale:'en-US',theme:'dark'}}};
let data;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1&&Array.isArray(saved.accounts)&&Array.isArray(saved.categories)&&Array.isArray(saved.transactions)&&Array.isArray(saved.members)&&saved.settings)data=saved;else data=seed()}catch{data=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('Could not save data in this browser.',true)}};
const money=n=>new Intl.NumberFormat(data.settings.locale||'en-US',{style:'currency',currency:data.settings.currency||'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const compact=n=>new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n||0);
const dateFmt=s=>s?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(s+'T12:00:00')):'—';
const cat=id=>data.categories.find(c=>c.id===id), account=id=>data.accounts.find(a=>a.id===id), badge=id=>{const c=cat(id);return c?`<span class="badge" style="color:${esc(c.color)};background:${esc(c.color)}21"><i style="background:${esc(c.color)}"></i>${esc(c.name)}</span>`:'<span class="badge">Uncategorized</span>'};
function toast(msg,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),3000)}
function monthKey(d){return d.slice(0,7)}function monthStart(offset=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return iso(d).slice(0,7)}
function totals(month,kind){return data.transactions.filter(t=>monthKey(t.date)===month&&(!kind||t.type===kind)).reduce((s,t)=>s+Number(t.amount),0)}
function balance(){return data.accounts.reduce((s,a)=>s+Number(a.initialBalance||0),0)+data.transactions.reduce((s,t)=>s+(t.type==='income'?1:-1)*Number(t.amount),0)}
let active='Dashboard',txFilters={month:'all',category:'all',account:'all',type:'all',q:''};

function trapFocus(container){const selector='button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';const get=()=>Array.from(container.querySelectorAll(selector)).filter(e=>e.offsetParent!==null);const close=()=>{$('#modalRoot').innerHTML='';document.removeEventListener('keydown',key)};function key(e){if(e.key==='Escape'){e.preventDefault();close();return}if(e.key==='Tab'){const a=get();if(!a.length)return;const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}document.addEventListener('keydown',key);const obs=new MutationObserver(()=>{if(!container.isConnected){document.removeEventListener('keydown',key);obs.disconnect()}});obs.observe($('#modalRoot'),{childList:true});get()[0]?.focus();return()=>{document.removeEventListener('keydown',key);obs.disconnect()}}

function modalShell(title,body){$('#modalRoot').innerHTML=`<div class="overlay" data-close></div><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="iconbtn" data-close aria-label="Close dialog">×</button></div>${body}</section>`;$$('[data-close]').forEach(b=>b.onclick=()=>$('#modalRoot').innerHTML='');trapFocus($('#modalRoot .modal'))}
function openTx(tx){const edit=!!tx,types=['expense','income'];modalShell(edit?'Edit transaction':'Add transaction',`<form id="txForm" novalidate><div class="form-grid"><div class="field"><label for="txType">Type</label><select id="txType" name="type">${types.map(t=>`<option value="${t}" ${tx?.type===t?'selected':!tx&&t==='expense'?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select><span class="error" data-error="type"></span></div><div class="field"><label for="txAmount">Amount</label><input id="txAmount" name="amount" type="number" min=".01" step=".01" value="${tx?esc(tx.amount):''}" placeholder="0.00"><span class="error" data-error="amount"></span></div><div class="field"><label for="txDate">Date</label><input id="txDate" name="date" type="date" value="${tx?esc(tx.date):today()}"><span class="error" data-error="date"></span></div><div class="field"><label for="txCategory">Category</label><select id="txCategory" name="categoryId">${data.categories.map(c=>`<option value="${esc(c.id)}" ${tx?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span class="error" data-error="categoryId"></span></div><div class="field"><label for="txAccount">Account</label><select id="txAccount" name="accountId">${data.accounts.map(a=>`<option value="${esc(a.id)}" ${tx?.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><span class="error" data-error="accountId"></span></div><div class="field"><label for="txMember">Member</label><select id="txMember" name="member">${data.members.map(m=>`<option ${tx?.member===m?'selected':''}>${esc(m)}</option>`).join('')}</select><span class="error" data-error="member"></span></div><div class="field full"><label for="txNote">Description</label><input id="txNote" name="note" value="${esc(tx?.note||'')}" placeholder="What was this transaction for?"><span class="error" data-error="note"></span></div></div><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">${edit?'Save changes':'Add transaction'}</button></div></form>`);$$('[data-close]').forEach(b=>b.onclick=()=>$('#modalRoot').innerHTML='');$('#modalRoot .overlay').onclick=()=>$('#modalRoot').innerHTML='';const form=$('#txForm');form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),v=Object.fromEntries(f.entries()),errs={};if(!(Number(v.amount)>0))errs.amount='Enter an amount greater than zero.';if(!v.date||!iso(v.date))errs.date='Choose a valid date.';if(!v.categoryId||!cat(v.categoryId))errs.categoryId='Choose a category.';if(!v.accountId||!account(v.accountId))errs.accountId='Choose an account.';if(!v.member)errs.member='Choose a family member.';$$('.error[data-error]').forEach(x=>x.textContent=errs[x.dataset.error]||'');if(Object.keys(errs).length){form.querySelector(`[name="${Object.keys(errs)[0]}"]`)?.focus();return}const next={...(tx||{}),id:tx?.id||uid(),date:iso(v.date),amount:Number(v.amount),type:v.type,categoryId:v.categoryId,accountId:v.accountId,member:v.member,note:v.note.trim()};if(edit)data.transactions=data.transactions.map(t=>t.id===tx.id?next:t);else data.transactions.push(next);save();$('#modalRoot').innerHTML='';render();toast(edit?'Transaction updated.':'Transaction saved.')}}
function deleteTx(id){if(!confirm('Delete this transaction? This cannot be undone.'))return;data.transactions=data.transactions.filter(t=>t.id!==id);save();render();toast('Transaction deleted.')}
// FIX: One document-level click handler serves all data-action=newtx buttons.
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="newtx"]');if(!b)return;if(b.textContent.trim()==='View all'){active='Transactions';render()}else openTx()});
// FIX: Leave the initial skeleton visible until the first render after 400ms.
setTimeout(() => render(), 400);
// Best-effort inline service worker. Blob workers are rejected by some browsers/file://; the app remains fully usable without it.
if('serviceWorker'in navigator){try{const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('<!doctype html><title>Ledgerly</title><h1>Ledgerly is available offline</h1>',{headers:{'Content-Type':'text/html'}}))))`;const url=URL.createObjectURL(new Blob([sw],{type:'text/javascript'}));navigator.serviceWorker.register(url).catch(()=>{})}catch{}}
})();
</script></body></html>
